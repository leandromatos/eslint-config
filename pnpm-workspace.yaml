# Native postinstall scripts pnpm blocks by default. `unrs-resolver` ships the native
# binding `eslint-plugin-import-x` resolves with, and without its build the import rules
# fall back to a slower JavaScript path.
allowBuilds:
  unrs-resolver: true

# pnpm 11 holds newly published versions for 24 hours by default. Adopting a version on
# the day it ships is worth more here than that delay.
minimumReleaseAge: 0

overrides:
  # eslint-plugin-tsdoc pins @typescript-eslint/utils to a release that refuses TypeScript 6. The
  # rest of typescript-eslint accepts it, so the plugin shares that copy.
  eslint-plugin-tsdoc>@typescript-eslint/utils: ^8.71.0

  # The types of eslint-plugin-jsx-a11y depend on ESLint 9, which is deprecated. They read only the
  # rule types, which ESLint 10 keeps.
  "@types/eslint-plugin-jsx-a11y>eslint": ^10.11.0

# eslint-plugin-react and eslint-plugin-jsx-a11y run under ESLint 10, and their latest releases
# declare peers only up to ESLint 9.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
