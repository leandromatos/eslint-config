name: Publish package to NPM

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: yarn

      - name: Build
        run: yarn build

      - name: Ensure Tag is on Latest Commit from 'main'
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          BRANCH="main"

          TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME")
          git fetch origin "$BRANCH"
          BRANCH_COMMIT=$(git rev-parse origin/"$BRANCH")

          if [ "$TAG_COMMIT" != "$BRANCH_COMMIT" ]; then
            echo "Tag '$TAG_NAME' is not pointing to the latest commit on '$BRANCH'"
            exit 1
          fi

      - name: Validate Tag Commit Message
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME")
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s" "$TAG_COMMIT")
          echo "$COMMIT_MESSAGE" | yarn commitlint --verbose

      - name: Publish to NPM
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"

          # The tag carries the version, package.json does not. A snapshot leaves
          # no commit behind, so the checked-out package.json still holds the
          # previous release; writing the tag's version in here is what keeps the
          # published artifact and the tag in agreement on both paths.
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          if [[ "$VERSION" == *-snapshot.* ]]; then
            npm publish --tag snapshot
          else
            npm publish --tag latest
          fi

      # Production only. A snapshot is a throwaway preview and the 'snapshot'
      # dist-tag is its record; one pre-release per dogfooding cycle would bury
      # the real ones.
      - name: Create GitHub Release
        if: ${{ !contains(github.ref_name, '-snapshot.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: ./scripts/release/create-github-release.sh "$TAG"
